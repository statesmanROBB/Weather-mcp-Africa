[project]
name = "weather-mcp-africa"
version = "0.2.0"
description = "Zero-key weather intelligence for Africa and the world via Open-Meteo."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cachetools>=7.3.0",
    "httpx2>=2.14.0",
    "mcp[cli]>=2.3.0",
]

[project.scripts]
weather-mcp-africa = "weather_mcp_africa.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_mcp_africa"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "respx>=0.23.1",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:respx"
testpaths = ["tests"]
